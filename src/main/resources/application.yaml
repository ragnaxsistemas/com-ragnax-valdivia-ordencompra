info:
  app:
    description: '@project.description@'
    encoding: '@project.build.sourceEncoding@'
    java:
      version: '@java.version@'
    name: '@project.name@'
    version: '@project.version@'
spring:
  application:
    name: com-ragnax-valdivia-ordencompra
  # Configuración de Hikari (Global o específica)
  maximum-pool-size: 10
  minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 110MB
      max-request-size: 110MB
  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: re_UNjdbpTp_GF4LZDirLGtHe9LDy2TojzhR
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
        socketFactory:
          port: 465
          class: javax.net.ssl.SSLSocketFactory
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: true
  use-fqn: true


server:
  port: 8888
  servlet:
    context-path: /ccmvaldivia
    session:
      cookie:
        secure: true
    forward-headers-strategy: native

logging:
  level:
    com:
      ragnax:
        valdivia:
          ordencompra: INFO
  file:
    name: logfile
    path: /
management:
  endpoint:
    import jakarta.persistence.s:
      enabled: true
    metrics:
      enabled: true
    health:
      show-details: always
  endpoints:
    web:
      base-path: /actuator/${spring.application.name}
      exposure:
        include: logfile,health

swagger:
  configuracion:
    apiinfo:
      titulo: ${spring.application.name} - ${spring.profiles.active}
      version: ${info.app.version}
      descripcion: Microservices ${spring.application.name}-> ${spring.profiles.active}
      termsOfServiceUrl: www.google.com
      license: Swagger license ${spring.profiles.active}
      licenseUrl: www.facebook.com
    documentacion:
      swgg: http://localhost:${server.port}/swagger-ui.html#
      docs: http://localhost:${server.port}/api-docs.yaml
    empresainfo:
      email: ceo@ragnaxsistemas.cl
      nombre: RagnaxSistemas
      url: www.ragnaxsistemas.cl

archivo:
  html:
    nombreCarpetaTemplate: templates/
    nombreHtmlConfirmada: oc_confirmada.html
    nombreHtmlAnulada: oc_anulada.html
    logoEscudoBl: logos/LOGO_CCM_BL.png
    logoEscudoColor: logos/LOGO_CCM_COLOR.png
    logoEscudoNegro: logos/LOGO_CCM_NEGRO.png
    logoTimbreContabilidad: logos/Timbre_Contabilidad.png
    logoTimbreGerencia: logos/Timbre_Gerencia.png

